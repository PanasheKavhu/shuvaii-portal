name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  db:
    # RLS and cross-school pgTAP tests against a local Supabase stack. The
    # Supabase CLI is the pinned devDependency from package-lock.json, the same
    # one `npm run db:start` uses locally. Only Postgres, Auth (creates the
    # auth schema) and Storage (creates the storage schema the branding and
    # import tests use) are started; `supabase start` applies the migrations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase --version
      - name: Start Supabase (database, auth, storage only)
        run: >-
          npx supabase start
          -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run test:db
      - if: always()
        run: npx supabase stop --no-backup

  e2e:
    # Playwright on both screen sizes against a local Supabase stack, the
    # seed and the dev server (D54: every admin, head and super admin sign in
    # now has a second step, so the whole suite runs here). The timing
    # checks (the perf project) stay local: shared runners are too noisy.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Supabase
        run: >-
          npx supabase start
          -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Write .env.local from the local stack
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "LEARNER_PIN_SECRET=ci-only-learner-pin-secret-0123456789abcdef"
          } > .env.local
      - run: npm run db:seed
      - run: npx playwright test --project=mobile --project=desktop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup
